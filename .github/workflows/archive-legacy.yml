name: Archive historical Python controller
on:
  push:
    paths:
      - ".github/workflows/archive-legacy.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag-python-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive old Python implementation as annotated Git tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="python-legacy-v1"
          COMMIT="ac803a0cf1f45ba6599111cfb562a0433514b955"
          git cat-file -e "${COMMIT}^{commit}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}"; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-parse "${TAG}^{commit}")" = "$COMMIT"
            echo "Existing tag already points to the correct historical commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$COMMIT" -m "Last Python/PowerShell controller before native C++ replacement"
            git push origin "refs/tags/$TAG"
          fi
