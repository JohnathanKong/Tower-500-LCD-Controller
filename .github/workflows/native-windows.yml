name: Native C++ Windows build
on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native-windows.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S native -B native/build -A x64
      - name: Build Release
        run: cmake --build native/build --config Release --parallel
      - name: Assemble portable installation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/dist | Out-Null
          Copy-Item native/build/Release/thermaltake500lcd.exe native/dist/
          Copy-Item native/build/Release/thermaltake500lcd.service.exe native/dist/
          Copy-Item native/Install.ps1 native/dist/
          Copy-Item native/Install.cmd native/dist/
          Copy-Item native/README.md native/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Thermaltake500LCD-Windows-x64
          path: native/dist/
          if-no-files-found: error
