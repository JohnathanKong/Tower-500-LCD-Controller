name: Native C++ Windows build
on:
  push:
    paths:
      - "src/**"
      - "assets/**"
      - "resources/**"
      - "include/**"
      - "CMakeLists.txt"
      - "Install.ps1"
      - "Install.cmd"
      - "README.md"
      - ".github/workflows/native-windows.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Assemble installation package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/thermaltake500lcd.exe dist/
          Copy-Item build/Release/thermaltake500lcd.service.exe dist/
          Copy-Item Install.ps1 dist/
          Copy-Item Install.cmd dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Thermaltake500LCD-Windows-x64
          path: dist/
          if-no-files-found: error
