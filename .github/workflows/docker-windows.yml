name: Docker cross-compiled Windows x64 build
on:
  push:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "docker/**"
      - "CMakeLists.txt"
      - "src/**"
      - "assets/**"
      - "resources/**"
      - "include/**"
      - "Install.*"
      - ".github/workflows/docker-windows.yml"
  workflow_dispatch:
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native Windows programs in Docker
        run: docker compose run --build --rm build
      - name: Upload standalone Windows executables and installer
        uses: actions/upload-artifact@v4
        with:
          name: Thermaltake500LCD-Docker-Windows-x64
          path: dist/
          if-no-files-found: error
